# 품질 게이트 — `docs/crp/groups/orm-raw-repository/charter.md` §3 (GATE 3) 자동화.
#
# 여기 있는 검사는 전부 charter 의 인수 기준을 1:1로 옮긴 것이다. 새 검사를 넣기 전에
# charter §3 을 먼저 고친다 — CI 가 계약보다 앞서 나가면 "왜 막혔는지" 근거가 사라진다.
#
# 배포·빌드는 다루지 않는다. 이미지 빌드·푸시·릴리스는 별도 인프라 저장소 소관이다.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # 의존성 권고는 코드가 바뀌지 않아도 밖에서 늘어난다. push 가 없는 주에도 게이트의
  # supply 그룹(pip-audit)이 돌도록 주 1회 실행한다. 월요일 00:00 UTC = 09:00 KST.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# CI 에는 .env 가 없다. 게이트는 `config` 를 import 하므로 ENV=test 여야 설정 검사
# (.env 부재·예시 비밀값)를 건너뛴다. pytest 는 pyproject 의 env 로 이미 ENV=test 다.
env:
  ENV: test

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: GATE 3 (charter §3)
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # 패키지 다운로드 캐시. mypy/pytest 결과에는 영향이 없다(아래 주석 참조).
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version(3.14)을 uv 가 읽어 인터프리터를 맞춘다(지원 하한은 requires-python >=3.13).
      # --locked: uv.lock 이 pyproject 와 어긋나면(락 갱신이 필요하면) 설치하지 않고 실패한다(재현성).
      # frozen 모드는 그 확인을 건너뛰고 락을 그대로 설치한다 — 락에 없는 새 의존성이 조용히 빠진다.
      - name: 의존성 설치
        run: uv sync --locked

      # ── 정적 분석 · 공급망 · 문서 ────────────────────────────────────────
      # 개별 도구를 여기 나열하지 않는다. 명령 목록과 판정 규칙은
      # scripts/review_gate.py 가 소유하고, 로컬 개발자도 **같은 파일**을 실행한다.
      # 게이트가 CI YAML 안에만 있으면 로컬에서 재현할 수 없고, 그 순간
      # "CI 에서만 되는" 상태와 "내 컴퓨터에서만 되는" 상태가 동시에 생긴다.
      #
      # mypy 캐시는 의도적으로 복원하지 않는다. 따뜻한 캐시의 결과를 게이트 결과로
      # 기록해 3라운드 연속 오기한 적이 있다(ledger LEDGER-1). CI 가 매번 콜드
      # 캐시로 도는 것이 그 사고에 대한 구조적 방어다.
      #
      # deps 는 uv.lock 기준 취약점 검사라 네트워크가 필요하다. Bandit 은 의존성
      # CVE 를 보지 않으므로 이것이 별도 게이트로 존재해야 한다.
      - name: review gate (static · structure · supply · docs · deps)
        run: uv run python -m scripts.review_gate --group static structure supply docs deps

      # ── 테스트 ──────────────────────────────────────────────────────────
      # -rsxX: 건너뛴 테스트를 로그에 드러낸다.
      # --cov=app --cov-report=term-missing: 커버리지를 측정·출력만 한다. 하한은 pyproject 의
      # [tool.coverage.report] fail_under 하나가 정본(기본 0)이라 여기에 --cov-fail-under 를 두지 않는다.
      # --cov-config=pyproject.toml: 설정 파일을 명시해야 pytest-cov 가 그 절대 경로를 서브프로세스 테스트에
      # 넘긴다. 빠지면 자식이 branch 없는 기본 설정으로 측정해 결과 합치기가 실패한다(INTERNALERROR).
      # skip-covered 는 쓰지 않는다 — "N files skipped due to complete coverage" 줄이 SKIP 판정과 같은
      # 단어를 쓴다(지금 정규식은 숫자 바로 뒤의 skipped 만 잡아 걸리지 않지만, 판정을 넓히면 오탐이 된다).
      # charter §3 은 "조용한 SKIP·xfail 0" 을 인수 기준으로 둔다 — 통과 개수만 보고
      # 넘어가면 비활성화된 테스트가 초록불 뒤에 숨는다. 그래서 요약을 직접 판정한다.
      # 이 job 에는 MySQL 이 없다. mysql 마커를 함께 돌리면 전부 skip 되고, 아래
      # "SKIP 0" 판정에 걸려 초록을 받을 수 없다. 그래서 여기서는 명시적으로
      # 제외하고, 그 집합은 아래 mysql job 이 **실제 MySQL 에 대고** 실행한다.
      # REDIS_HOST·REDIS_PORT 를 명시한다(integration-e2e W0). 이 job 에는 Redis 가 없고 단위 테스트는
      # 가짜 클라이언트를 쓴다 — 실수로 실물 접속이 생기면 기본 6379 가 아니라 닫힌 포트에서 실패한다.
      - name: pytest (mysql 마커 제외)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "16392"
        run: |
          set -o pipefail
          uv run python -m pytest -m "not mysql" -q -rsxX --cov=app --cov-config=pyproject.toml --cov-report=term-missing | tee pytest.log

      # deselected 는 위 -m 필터가 만드는 정상 결과라 판정에서 뺀다. 대신 그
      # deselect 된 집합이 실제로 돌았는지는 mysql job 이 책임진다 — 어느 쪽에서도
      # 실행되지 않는 테스트가 생기지 않도록 두 job 이 정확히 상보 관계다.
      - name: SKIP·xfail 0건 확인 (charter §3)
        run: |
          if grep -qE '[1-9][0-9]* (skipped|xfailed|xpassed)' pytest.log; then
            echo "::error::charter §3 위반 — 조용한 SKIP/xfail 이 있습니다. 요약을 확인하세요."
            grep -E '(skipped|xfailed|xpassed)' pytest.log || true
            exit 1
          fi
          echo "SKIP·xfail 0건"


  # ──────────────────────────────────────────────────────────────────────────
  # MySQL 8.4 통합 (계획서 §9, Phase 5)
  #
  # 로컬과 **같은** compose.test.yaml 을 쓴다. GitHub Actions 의 services: 블록을
  # 쓰지 않는 이유는 그렇게 하면 로컬 재현 경로가 갈라지기 때문이다 — 개발자가
  # 손으로 띄우는 것과 CI 가 띄우는 것이 같은 파일이어야 "CI 에서만 되는" 상태를
  # 막을 수 있다.
  #
  # SQLite 단위 테스트는 Base 계약을 검증하지만 MySQL 방언 승인의 근거가 되지
  # 못한다. migration chain 의 ALTER·인덱스 이름 길이·FK 순서는 여기서 처음 깨진다.
  # ──────────────────────────────────────────────────────────────────────────
  mysql:
    name: MySQL 8.4 통합 (compose.test.yaml)
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --locked

      # --wait 는 healthcheck 가 healthy 가 될 때까지 막는다. 컨테이너 "시작" 과
      # "접속 가능" 은 다르다 — 이 게이트 없이 붙으면 첫 테스트가 깨진다.
      - name: MySQL 기동
        run: docker compose -f compose.test.yaml up -d --wait

      # 마커가 붙은 테스트가 **실제로 실행**됐는지 본다. skip 은 실패다 — MySQL 이
      # 없어서 전부 건너뛴 초록이 이 단계의 존재 이유를 지운다(C-4).
      # deselected 는 -m 필터가 만드는 정상 결과이므로 판정에서 뺀다.
      - name: pytest -m mysql (skip 금지)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "16392"
        run: |
          set -o pipefail
          uv run python -m pytest -m mysql -q -rsxX | tee mysql.log
          if grep -qE '[1-9][0-9]* skipped' mysql.log; then
            echo "::error::MySQL 통합 테스트가 skip 됐습니다. compose 기동을 확인하세요."
            grep -E 'skipped' mysql.log || true
            exit 1
          fi
          if grep -q 'no tests ran' mysql.log; then
            echo "::error::mysql 마커가 붙은 테스트가 0건입니다."
            exit 1
          fi

      # 계획서 §10 은 "전체 suite 의 skip/xfail/deselected 0" 을 요구한다. MySQL 이
      # 떠 있는 이 job 에서만 그 조건이 성립한다 — 여기서 한 번 전수로 확인한다.
      # 전체 suite 의 skip/xfail/deselected 0 판정은 MySQL 이 떠 있는 이 job 에서만
      # 성립한다. 판정 규칙은 gate job 과 같은 파일이 소유한다.
      - name: review gate (tests — 전체 suite, skip·deselect 0)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "16392"
        run: uv run python -m scripts.review_gate --group tests

      # 실패해도 정리한다 — 러너가 재사용되는 환경에서 컨테이너와 볼륨이 남지 않게.
      - name: MySQL 정리
        if: always()
        run: docker compose -f compose.test.yaml down -v


  # ──────────────────────────────────────────────────────────────────────────
  # 전수 통합(E2E) — integration-e2e W6
  #
  # 로컬과 같은 compose.e2e.yaml(MySQL 8.4 primary + GTID replica, Redis 7.4) 위에서 실제 uvicorn·Celery
  # worker·Chromium 을 띄워 tests/e2e 를 돌린다. 매 push 에 돈다. skip·xfail·xpass 가 하나라도 있거나
  # 실행된 테스트가 0 이면 실패다. 실패하면 앱·worker·MySQL 로그와 산출물 폴더를 artifact 로 올린다.
  # ──────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (compose.e2e.yaml, -m e2e)
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 45

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "16392"
      E2E_ARTIFACT_DIR: ${{ github.workspace }}/.e2e-artifacts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 의존성 설치
        run: uv sync --locked

      - name: Chromium 설치
        run: uv run python -m playwright install --with-deps chromium

      # 실행마다 새 DB 비밀번호 — 로그 비밀값 grep(L6) 의 대상이기도 하다.
      - name: 실행 비밀값
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "E2E_MYSQL_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: compose 기동
        run: docker compose -p itest-active -f compose.e2e.yaml up -d --wait

      # 요약 줄은 마지막 줄이 아닐 수 있다(로그 listener 종료 줄이 뒤에 붙는다) — 정규식으로 찾는다.
      - name: pytest -m e2e (skip·xfail 0, 0건 금지)
        run: |
          set -o pipefail
          uv run python -m pytest -m e2e -q -rsxX | tee e2e.log
          plain=$(sed 's/\x1b\[[0-9;]*m//g' e2e.log)
          if echo "$plain" | grep -qE '\b[1-9][0-9]* (skipped|xfailed|xpassed)\b'; then
            echo "::error::E2E 에 skip·xfail 이 있습니다."
            echo "$plain" | grep -E '(skipped|xfailed|xpassed)' || true
            exit 1
          fi
          if ! echo "$plain" | grep -qE '\b[1-9][0-9]* passed\b'; then
            echo "::error::E2E 테스트가 0건입니다."
            exit 1
          fi

      - name: 실패 로그 수집
        if: failure()
        run: |
          mkdir -p "$E2E_ARTIFACT_DIR"
          cp e2e.log "$E2E_ARTIFACT_DIR/" 2>/dev/null || true
          docker compose -p itest-active logs --no-color > "$E2E_ARTIFACT_DIR/compose.log" 2>&1 || true

      - name: 실패 산출물 업로드
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-artifacts
          path: .e2e-artifacts/
          retention-days: 7

      # 데이터는 tmpfs 라 down 으로 끝난다(-v 불필요).
      - name: compose 정리
        if: always()
        run: docker compose -p itest-active -f compose.e2e.yaml down
