# 품질 게이트. 검사 목록과 판정 규칙은 `scripts/review_gate.py` 가 소유하고, 로컬도 같은 파일을 실행한다.
#
# 배포·빌드는 다루지 않는다. 이미지 빌드·푸시·릴리스는 별도 인프라 저장소 소관이다.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # 의존성 권고는 코드가 바뀌지 않아도 밖에서 늘어난다. push 가 없는 주에도 게이트의
  # supply·deps 검사(pip-audit)가 돌도록 주 1회 실행한다. 월요일 00:00 UTC = 09:00 KST.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

# CI 에는 .env 가 없다. 게이트는 `config` 를 import 하므로 ENV=test 여야 설정 검사
# (.env 부재·예시 비밀값)를 건너뛴다. pytest 는 pyproject 의 env 로 이미 ENV=test 다.
env:
  ENV: test

# 같은 ref 에 연달아 푸시하면 앞선 실행은 취소한다(러너 낭비 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: review gate
    runs-on: ubuntu-24.04  # ubuntu-latest 는 2026-10-19 부터 Ubuntu 26 으로 바뀐다 — 검증 전까지 고정
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: uv 설치
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # .python-version(3.14)을 uv 가 읽어 인터프리터를 맞춘다(지원 하한은 requires-python >=3.13).
      # --locked: uv.lock 이 pyproject 와 어긋나면 설치하지 않고 실패한다(재현성).
      - name: 의존성 설치
        run: uv sync --locked

      # mypy 캐시는 복원하지 않는다 — 따뜻한 캐시가 콜드 실행과 다른 결과를 낸 적이 있다.
      # deps 는 uv.lock 기준 취약점 검사라 네트워크가 필요하다.
      - name: review gate (static · structure · supply · docs · files · deps)
        run: uv run python -m scripts.review_gate --group static structure supply docs files deps

      # 전체 suite 를 커버리지와 함께 돌리고, skip·xfail·deselect 가 하나라도 있으면 실패한다.
      # 테스트는 SQLite 와 가짜 Redis 만 쓴다. REDIS_HOST·REDIS_PORT 는 실수로 실물 접속이 생기면
      # 기본 6379 가 아니라 닫힌 포트에서 실패하게 하려는 값이다.
      - name: review gate (tests)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "16392"
        run: uv run python -m scripts.review_gate --group tests
